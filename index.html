<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f0f2f5;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-top: 0;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            margin: 10px 0;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
        }
        button:hover {
            background: #45a049;
        }
        #qrcode {
            margin: 20px auto;
            display: inline-block;
            padding: 15px;
            background: white;
            border-radius: 8px;
        }
        .hidden {
            display: none;
        }
        .info {
            margin-top: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 14px;
            word-break: break-all;
            color: #333;
        }
        .error {
            color: red;
            margin: 10px 0;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-group button {
            flex: 1;
            padding: 10px;
            font-size: 14px;
        }
        .btn-download {
            background: #2196F3;
        }
        .btn-download:hover {
            background: #0b7dda;
        }
        .btn-copy {
            background: #ff9800;
        }
        .btn-copy:hover {
            background: #e68a00;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>📱 QR Generator</h1>
        <p style="color:#666;font-size:14px;">Masukkan link atau teks, langsung bisa discan!</p>
        
        <input type="text" id="text" placeholder="https://google.com" value="https://google.com">
        
        <button onclick="generate()">🔮 Generate QR</button>
        
        <div id="error" class="error"></div>
        
        <div id="qrContainer" class="hidden">
            <div id="qrcode"></div>
            <div class="info" id="qrText"></div>
            <div class="btn-group">
                <button class="btn-download" onclick="downloadQR()">⬇️ Download</button>
                <button class="btn-copy" onclick="copyQR()">📋 Copy</button>
            </div>
        </div>
    </div>

    <script>
        let qr = null;
        let currentText = '';

        function generate() {
            const text = document.getElementById('text').value.trim();
            const error = document.getElementById('error');
            const container = document.getElementById('qrContainer');
            
            if (!text) {
                error.textContent = '⚠️ Isi dulu!';
                container.classList.add('hidden');
                return;
            }
            
            error.textContent = '';
            currentText = text;
            
            // Hapus QR lama
            document.getElementById('qrcode').innerHTML = '';
            
            // Generate QR BARU
            qr = new QRCode(document.getElementById('qrcode'), {
                text: text,
                width: 250,
                height: 250,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
            
            // Tampilkan
            container.classList.remove('hidden');
            document.getElementById('qrText').textContent = '📌 ' + text;
        }

        function downloadQR() {
            const canvas = document.querySelector('#qrcode canvas');
            if (!canvas) return alert('Generate dulu!');
            
            const link = document.createElement('a');
            link.download = 'qr-code.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function copyQR() {
            const canvas = document.querySelector('#qrcode canvas');
            if (!canvas) return alert('Generate dulu!');
            
            canvas.toBlob(async (blob) => {
                try {
                    await navigator.clipboard.write([
                        new ClipboardItem({ 'image/png': blob })
                    ]);
                    alert('✅ QR Code dicopy! Bisa paste di mana aja.');
                } catch {
                    alert('Copy gagal, coba download aja.');
                }
            });
        }

        // Enter = generate
        document.getElementById('text').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') generate();
        });

        // Auto generate pas load
        window.onload = generate;
    </script>
</body>
</html>
