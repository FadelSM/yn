<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        h1 span {
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .options input[type="color"] {
            width: 100%;
            height: 40px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 2px;
            cursor: pointer;
        }
        
        .options input[type="range"] {
            width: 100%;
        }
        
        .btn-generate {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-generate:active {
            transform: translateY(0);
        }
        
        .qr-container {
            margin-top: 30px;
            text-align: center;
            display: none;
        }
        
        .qr-container.show {
            display: block;
        }
        
        #qrcode {
            display: inline-block;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        .qr-actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn-action {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            color: white;
            font-size: 14px;
        }
        
        .btn-download {
            background: #10b981;
        }
        
        .btn-download:hover {
            background: #059669;
        }
        
        .btn-copy {
            background: #3b82f6;
        }
        
        .btn-copy:hover {
            background: #2563eb;
        }
        
        .btn-share {
            background: #8b5cf6;
        }
        
        .btn-share:hover {
            background: #7c3aed;
        }
        
        .error {
            color: #ef4444;
            margin-top: 10px;
            font-size: 14px;
        }
        
        .success {
            color: #10b981;
            margin-top: 10px;
            font-size: 14px;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            
            .options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ <span>QR Generator</span></h1>
        
        <div class="input-group">
            <label>📝 Text atau URL</label>
            <input type="text" id="textInput" placeholder="https://example.com atau teks apapun...">
        </div>
        
        <div class="options">
            <div>
                <label>🎨 Warna QR</label>
                <input type="color" id="colorInput" value="#000000">
            </div>
            <div>
                <label>⬜ Background</label>
                <input type="color" id="bgInput" value="#ffffff">
            </div>
        </div>
        
        <div class="options">
            <div>
                <label>📏 Ukuran: <span id="sizeLabel">256</span>px</label>
                <input type="range" id="sizeInput" min="128" max="512" value="256" step="8">
            </div>
        </div>
        
        <button class="btn-generate" onclick="generateQR()">
            🚀 Generate QR Code
        </button>
        
        <div id="error" class="error"></div>
        
        <div class="qr-container" id="qrContainer">
            <div id="qrcode"></div>
            
            <div class="qr-actions">
                <button class="btn-action btn-download" onclick="downloadQR()">
                    ⬇️ Download
                </button>
                <button class="btn-action btn-copy" onclick="copyQR()">
                    📋 Copy
                </button>
                <button class="btn-action btn-share" onclick="shareQR()">
                    📤 Share
                </button>
            </div>
            
            <div id="message" class="success"></div>
        </div>
    </div>

    <script>
        let qrCodeInstance = null;
        let currentQRData = null;

        function generateQR() {
            const text = document.getElementById('textInput').value.trim();
            const color = document.getElementById('colorInput').value;
            const bgColor = document.getElementById('bgInput').value;
            const size = parseInt(document.getElementById('sizeInput').value);
            
            const errorDiv = document.getElementById('error');
            const container = document.getElementById('qrContainer');
            
            // Validasi
            if (!text) {
                errorDiv.textContent = '⚠️ Masukkan teks atau URL dulu!';
                container.classList.remove('show');
                return;
            }
            
            errorDiv.textContent = '';
            
            // Hapus QR lama
            const qrDiv = document.getElementById('qrcode');
            qrDiv.innerHTML = '';
            
            // Generate QR baru
            qrCodeInstance = new QRCode(qrDiv, {
                text: text,
                width: size,
                height: size,
                colorDark: color,
                colorLight: bgColor,
                correctLevel: QRCode.CorrectLevel.H
            });
            
            currentQRData = text;
            container.classList.add('show');
            
            // Animasi muncul
            container.style.animation = 'none';
            setTimeout(() => {
                container.style.animation = 'fadeIn 0.5s ease';
            }, 10);
            
            document.getElementById('message').textContent = '✅ QR Code berhasil dibuat!';
        }

        function downloadQR() {
            const canvas = document.querySelector('#qrcode canvas');
            if (!canvas) return;
            
            const link = document.createElement('a');
            link.download = `qr-code-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            
            document.getElementById('message').textContent = '✅ QR Code didownload!';
        }

        async function copyQR() {
            const canvas = document.querySelector('#qrcode canvas');
            if (!canvas) return;
            
            try {
                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                await navigator.clipboard.write([
                    new ClipboardItem({
                        [blob.type]: blob
                    })
                ]);
                document.getElementById('message').textContent = '✅ QR Code dicopy ke clipboard!';
            } catch (err) {
                alert('Copy gagal, coba download saja.');
            }
        }

        async function shareQR() {
            const canvas = document.querySelector('#qrcode canvas');
            if (!canvas) return;
            
            try {
                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                const file = new File([blob], 'qr-code.png', { type: 'image/png' });
                
                if (navigator.share) {
                    await navigator.share({
                        title: 'QR Code',
                        text: `QR Code untuk: ${currentQRData}`,
                        files: [file]
                    });
                } else {
                    downloadQR();
                }
            } catch (err) {
                if (err.name !== 'AbortError') {
                    alert('Share gagal, coba download.');
                }
            }
        }

        // Enter key untuk generate
        document.getElementById('textInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') generateQR();
        });

        // Update ukuran label
        document.getElementById('sizeInput').addEventListener('input', function() {
            document.getElementById('sizeLabel').textContent = this.value;
        });

        // Auto-generate saat ada perubahan warna
        document.getElementById('colorInput').addEventListener('change', generateQR);
        document.getElementById('bgInput').addEventListener('change', generateQR);
        document.getElementById('sizeInput').addEventListener('change', generateQR);

        // Tambahkan animasi
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(20px); }
                to { opacity: 1; transform: translateY(0); }
            }
        `;
        document.head.appendChild(style);

        // Generate default QR
        document.getElementById('textInput').value = 'https://example.com';
        generateQR();
    </script>
</body>
</html>
