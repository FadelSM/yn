<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generator Teks QR Code</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="container">
    <h2>QR Code Generator</h2>
    <p>Tulis pesan Anda. Saat QR code di-scan dengan Google Lens, teks ini akan langsung muncul.</p>
    
    <textarea id="text-input" placeholder="Tulis pesan Anda di sini..."></textarea>
    <button id="generate-btn">Buat QR Code</button>

    <div id="qrcode"></div>
  </div>

  <!-- Library eksternal untuk membuat QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="assets/script.js"></script>
</body>
</html>
