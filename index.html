  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #f8fafc;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 28px;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h2 {
      font-size: 1.4rem;
      text-align: center;
      color: #38bdf8;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #38bdf8;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #0284c7;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #0369a1;
    }

    .qr-container {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      min-height: 220px;
    }

    .placeholder-text {
      color: #64748b;
      font-size: 0.85rem;
    }

    .download-btn {
      background: #10b981;
      display: none;
      text-decoration: none;
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      color: #fff;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>QR Code Generator</h2>

    <div class="input-group">
      <label for="text-input">Teks atau Link URL</label>
      <input type="text" id="text-input" placeholder="Ketik sesuatu di sini...">
    </div>

    <button onclick="generateQR()">Buat QR Code</button>

    <div class="qr-container">
      <canvas id="qr-canvas" style="display:none;"></canvas>
      <span id="placeholder" class="placeholder-text">QR akan tampil di sini</span>
    </div>

    <a id="download-btn" class="download-btn" download="qrcode.png">Unduh Gambar</a>
  </div>

  <script>
    function generateQR() {
      const text = document.getElementById('text-input').value.trim();
      const canvas = document.getElementById('qr-canvas');
      const placeholder = document.getElementById('placeholder');
      const downloadBtn = document.getElementById('download-btn');

      if (!text) {
        alert('Isi teks atau URL terlebih dahulu!');
        return;
      }

      try {
        // Panggil engine QR Code murni internal
        const qr = new QRCode(1, 2); // Error Correction Level 'H' (paling akurat)
        qr.addData(text);
        qr.make();

        const count = qr.getModuleCount();
        const ctx = canvas.getContext('2d');
        const size = 200;
        const cellSize = Math.floor(size / count);
        const margin = 10;

        canvas.width = size + (margin * 2);
        canvas.height = size + (margin * 2);

        // Latar putih terang (penting agar Google Lens mudah baca)
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Modul QR Hitam
        ctx.fillStyle = '#000000';
        for (let r = 0; r < count; r++) {
          for (let c = 0; c < count; c++) {
            if (qr.isDark(r, c)) {
              ctx.fillRect(margin + c * cellSize, margin + r * cellSize, cellSize, cellSize);
            }
          }
        }

        // Tampilkan canvas dan siapkan tautan unduh
        placeholder.style.display = 'none';
        canvas.style.display = 'block';

        downloadBtn.href = canvas.toDataURL("image/png");
        downloadBtn.style.display = 'block';

      } catch (err) {
        alert("Teks terlalu panjang! Coba teks yang lebih singkat.");
      }
    }
  </script>
</body>
</html>
