<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator - Bisa Discan!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        h1 span {
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 25px;
            font-size: 14px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .options input[type="color"] {
            width: 100%;
            height: 40px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 2px;
            cursor: pointer;
        }
        
        .options input[type="range"] {
            width: 100%;
        }
        
        .btn-generate {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-generate:active {
            transform: translateY(0);
        }
        
        .btn-generate:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .qr-container {
            margin-top: 30px;
            text-align: center;
            display: none;
        }
        
        .qr-container.show {
            display: block;
        }
        
        #qrcode {
            display: inline-block;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        #qrcode img {
            max-width: 100%;
            height: auto;
        }
        
        .qr-actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn-action {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            color: white;
            font-size: 14px;
        }
        
        .btn-download {
            background: #10b981;
        }
        
        .btn-download:hover {
            background: #059669;
        }
        
        .btn-copy {
            background: #3b82f6;
        }
        
        .btn-copy:hover {
            background: #2563eb;
        }
        
        .btn-share {
            background: #8b5cf6;
        }
        
        .btn-share:hover {
            background: #7c3aed;
        }
        
        .error {
            color: #ef4444;
            margin-top: 10px;
            font-size: 14px;
            text-align: center;
        }
        
        .success {
            color: #10b981;
            margin-top: 10px;
            font-size: 14px;
            text-align: center;
        }
        
        .info-text {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
        
        .qr-content {
            margin-top: 15px;
            padding: 10px;
            background: #f3f4f6;
            border-radius: 8px;
            font-size: 13px;
            color: #333;
            word-break: break-all;
        }
        
        .qr-content strong {
            color: #667eea;
        }
        
        .test-scan {
            margin-top: 15px;
            padding: 12px;
            background: #fef3c7;
            border-radius: 8px;
            border-left: 4px solid #f59e0b;
            font-size: 13px;
            color: #92400e;
            text-align: left;
        }
        
        .test-scan code {
            background: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            
            .options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ <span>QR Generator</span></h1>
        <div class="subtitle">Bisa discan langsung ke link atau teks!</div>
        
        <div class="input-group">
            <label>📝 Masukkan Link atau Teks</label>
            <input type="text" id="textInput" placeholder="https://google.com atau teks apapun...">
            <div class="info-text">💡 Pastikan pakai https:// untuk link website</div>
        </div>
        
        <div class="options">
            <div>
                <label>🎨 Warna QR</label>
                <input type="color" id="colorInput" value="#000000">
            </div>
            <div>
                <label>⬜ Background</label>
                <input type="color" id="bgInput" value="#ffffff">
            </div>
        </div>
        
        <div class="options">
            <div style="grid-column: 1 / -1;">
                <label>📏 Ukuran: <span id="sizeLabel">300</span>px</label>
                <input type="range" id="sizeInput" min="150" max="500" value="300" step="10" style="width:100%;">
            </div>
        </div>
        
        <button class="btn-generate" id="generateBtn" onclick="generateQR()">
            🚀 Generate QR Code
        </button>
        
        <div id="error" class="error"></div>
        
        <div class="qr-container" id="qrContainer">
            <div id="qrcode"></div>
            
            <div class="qr-content" id="qrContent">
                <strong>📌 Isi QR:</strong> <span id="qrTextDisplay"></span>
            </div>
            
            <div class="test-scan">
                📱 <strong>Cara test:</strong> Scan pake HP (Google Lens, WhatsApp, atau QR Scanner bawaan). 
                Harusnya langsung buka link atau tampil teks!
            </div>
            
            <div class="qr-actions">
                <button class="btn-action btn-download" onclick="downloadQR()">
                    ⬇️ Download PNG
                </button>
                <button class="btn-action btn-copy" onclick="copyQR()">
                    📋 Copy Gambar
                </button>
                <button class="btn-action btn-share" onclick="shareQR()">
                    📤 Share
                </button>
            </div>
            
            <div id="message" class="success"></div>
        </div>
    </div>

    <script>
        let currentQRData = null;
        let currentQRImage = null;

        function generateQR() {
            const text = document.getElementById('textInput').value.trim();
            const color = document.getElementById('colorInput').value.replace('#', '');
            const bgColor = document.getElementById('bgInput').value.replace('#', '');
            const size = parseInt(document.getElementById('sizeInput').value);
            
            const errorDiv = document.getElementById('error');
            const container = document.getElementById('qrContainer');
            const btn = document.getElementById('generateBtn');
            
            // Validasi
            if (!text) {
                errorDiv.textContent = '⚠️ Masukkan teks atau URL dulu!';
                container.classList.remove('show');
                return;
            }
            
            errorDiv.textContent = '';
            
            // Loading state
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Generating...';
            
            // Hapus QR lama
            const qrDiv = document.getElementById('qrcode');
            qrDiv.innerHTML = '';
            
            // PAKE API QR CODE YANG SUDAH TERUJI
            // API ini menghasilkan QR Code yang BISA DISCAN dengan benar
            const apiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(text)}&color=${color}&bgcolor=${bgColor}&margin=20`;
            
            // Buat img element
            const img = document.createElement('img');
            img.src = apiUrl;
            img.alt = 'QR Code';
            img.width = size;
            img.height = size;
            img.style.maxWidth = '100%';
            img.style.height = 'auto';
            
            // Handle load
            img.onload = function() {
                currentQRData = text;
                currentQRImage = apiUrl;
                
                // Tampilkan QR
                qrDiv.appendChild(img);
                container.classList.add('show');
                
                // Tampilkan isi QR
                document.getElementById('qrTextDisplay').textContent = text;
                document.getElementById('message').textContent = '✅ QR Code berhasil dibuat! Bisa discan!';
                
                // Animasi
                container.style.animation = 'none';
                setTimeout(() => {
                    container.style.animation = 'fadeIn 0.5s ease';
                }, 10);
                
                btn.disabled = false;
                btn.innerHTML = '🚀 Generate QR Code';
            };
            
            // Handle error
            img.onerror = function() {
                errorDiv.textContent = '❌ Gagal generate QR. Coba lagi.';
                btn.disabled = false;
                btn.innerHTML = '🚀 Generate QR Code';
                container.classList.remove('show');
            };
        }

        function downloadQR() {
            const img = document.querySelector('#qrcode img');
            if (!img) {
                alert('Tidak ada QR Code!');
                return;
            }
            
            const link = document.createElement('a');
            link.download = `qr-code-${Date.now()}.png`;
            link.href = img.src;
            link.click();
            document.getElementById('message').textContent = '✅ QR Code didownload!';
        }

        async function copyQR() {
            const img = document.querySelector('#qrcode img');
            if (!img) {
                alert('Tidak ada QR Code!');
                return;
            }
            
            try {
                const response = await fetch(img.src);
                const blob = await response.blob();
                
                await navigator.clipboard.write([
                    new ClipboardItem({
                        [blob.type]: blob
                    })
                ]);
                document.getElementById('message').textContent = '✅ QR Code dicopy ke clipboard!';
            } catch (err) {
                alert('Copy gagal. Coba download saja.');
            }
        }

        async function shareQR() {
            const img = document.querySelector('#qrcode img');
            if (!img) {
                alert('Tidak ada QR Code!');
                return;
            }
            
            try {
                const response = await fetch(img.src);
                const blob = await response.blob();
                const file = new File([blob], 'qr-code.png', { type: 'image/png' });
                
                if (navigator.share) {
                    await navigator.share({
                        title: 'QR Code',
                        text: `QR Code untuk: ${currentQRData}`,
                        files: [file]
                    });
                } else {
                    downloadQR();
                }
            } catch (err) {
                if (err.name !== 'AbortError') {
                    alert('Share gagal.');
                }
            }
        }

        // Enter key
        document.getElementById('textInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') generateQR();
        });

        // Update size label
        document.getElementById('sizeInput').addEventListener('input', function() {
            document.getElementById('sizeLabel').textContent = this.value;
        });

        // Auto generate on color change
        document.getElementById('colorInput').addEventListener('change', function() {
            if (document.getElementById('textInput').value.trim()) {
                generateQR();
            }
        });
        
        document.getElementById('bgInput').addEventListener('change', function() {
            if (document.getElementById('textInput').value.trim()) {
                generateQR();
            }
        });

        // Auto generate on load
        window.onload = function() {
            document.getElementById('textInput').value = 'https://google.com';
            setTimeout(generateQR, 500);
        };
    </script>
</body>
</html>
