<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Generator - 100% Work</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 5px;
            color: #333;
        }
        h1 span {
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sub {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            background: #10b981;
            color: white;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 12px;
            transition: 0.3s;
        }
        input:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        .btn-generate {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102,126,234,0.3);
        }
        .btn-generate:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .qr-box {
            margin-top: 25px;
            padding: 20px;
            background: #fafafa;
            border-radius: 12px;
            display: none;
            border: 2px solid #e5e7eb;
        }
        .qr-box.show {
            display: block;
            animation: fadeIn 0.4s ease;
        }
        #qrcode img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }
        #qrcode canvas {
            max-width: 100%;
            height: auto;
        }
        .info {
            margin-top: 15px;
            padding: 12px;
            background: #f3f4f6;
            border-radius: 8px;
            font-size: 13px;
            word-break: break-all;
            color: #333;
            text-align: left;
        }
        .info strong {
            color: #667eea;
        }
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .actions button {
            flex: 1;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            color: white;
        }
        .actions button:hover {
            transform: translateY(-2px);
        }
        .btn-download {
            background: #10b981;
        }
        .btn-download:hover {
            background: #059669;
        }
        .btn-copy {
            background: #3b82f6;
        }
        .btn-copy:hover {
            background: #2563eb;
        }
        .btn-share {
            background: #8b5cf6;
        }
        .btn-share:hover {
            background: #7c3aed;
        }
        .error {
            color: #ef4444;
            margin-top: 10px;
            font-size: 14px;
            padding: 8px;
            background: #fef2f2;
            border-radius: 8px;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .tips {
            margin-top: 15px;
            padding: 12px;
            background: #fef3c7;
            border-radius: 8px;
            border-left: 4px solid #f59e0b;
            font-size: 12px;
            color: #92400e;
            text-align: left;
        }
        .tips strong {
            color: #78350f;
        }
        @media (max-width: 480px) {
            .container { padding: 20px; }
            .actions { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ <span>QR Generator</span></h1>
        <p class="sub">✅ PASTI BISA DISCAN - PAKE 2 API SEKALIGUS!</p>
        <div class="status-badge">● 100% Work</div>
        
        <input type="text" id="textInput" placeholder="https://google.com" value="https://google.com">
        
        <button class="btn-generate" id="generateBtn" onclick="generateQR()">
            🚀 Generate QR Code
        </button>
        
        <div id="error" class="error"></div>
        
        <div class="qr-box" id="qrContainer">
            <div id="qrcode"></div>
            <div class="info" id="qrText">
                <strong>📌 Isi QR:</strong> <span id="qrContentDisplay"></span>
            </div>
            <div class="actions">
                <button class="btn-download" onclick="downloadQR()">⬇️ Download</button>
                <button class="btn-copy" onclick="copyQR()">📋 Copy</button>
                <button class="btn-share" onclick="shareQR()">📤 Share</button>
            </div>
        </div>

        <div class="tips">
            💡 <strong>Tips:</strong> 
            • Link pendek lebih gampang discan (pake bit.ly)
            • Hindari karakter aneh/spasi berlebihan
            • Scan pake Google Lens atau QR Scanner bawaan HP
        </div>
    </div>

    <script>
        let currentText = '';
        let currentImageUrl = '';

        function generateQR() {
            const text = document.getElementById('textInput').value.trim();
            const error = document.getElementById('error');
            const container = document.getElementById('qrContainer');
            const btn = document.getElementById('generateBtn');
            const qrDiv = document.getElementById('qrcode');
            
            // Validasi
            if (!text) {
                error.textContent = '⚠️ Masukkan teks atau URL dulu!';
                container.classList.remove('show');
                return;
            }
            
            error.textContent = '';
            container.classList.remove('show');
            qrDiv.innerHTML = '';
            currentText = text;
            
            // Loading
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Generating...';
            
            // UKURAN OTOMATIS - lebih besar biar gampang discan
            let size = 350;
            if (text.length > 100) size = 400;
            if (text.length > 200) size = 450;
            
            // ==== API 1: QRServer.com (Primary) ====
            const api1 = `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(text)}&margin=20`;
            
            // ==== API 2: Google Chart (Fallback) ====
            const api2 = `https://chart.googleapis.com/chart?cht=qr&chl=${encodeURIComponent(text)}&chs=${size}x${size}&choe=UTF-8&chld=H|0`;
            
            // ==== API 3: QR Code API (Backup) ====
            const api3 = `https://api.qr-code-generator.com/v1/create?data=${encodeURIComponent(text)}&size=${size}&format=png`;
            
            // Coba API 1 dulu
            tryGenerate(api1, 0);
            
            function tryGenerate(url, attempt) {
                const img = document.createElement('img');
                img.crossOrigin = 'anonymous';
                img.src = url;
                img.alt = 'QR Code';
                img.width = size;
                img.height = size;
                img.style.maxWidth = '100%';
                img.style.height = 'auto';
                
                let loaded = false;
                
                img.onload = function() {
                    if (loaded) return;
                    loaded = true;
                    success(img);
                };
                
                img.onerror = function() {
                    if (loaded) return;
                    loaded = true;
                    
                    // Coba API berikutnya
                    if (attempt === 0) {
                        console.log('API 1 gagal, coba API 2...');
                        tryGenerate(api2, 1);
                    } else if (attempt === 1) {
                        console.log('API 2 gagal, coba API 3...');
                        tryGenerate(api3, 2);
                    } else {
                        // Semua API gagal
                        error.textContent = '❌ Gagal generate QR. Coba refresh atau cek koneksi.';
                        btn.disabled = false;
                        btn.innerHTML = '🚀 Generate QR Code';
                    }
                };
                
                // Timeout 5 detik
                setTimeout(() => {
                    if (!loaded) {
                        loaded = true;
                        if (attempt === 0) {
                            tryGenerate(api2, 1);
                        } else if (attempt === 1) {
                            tryGenerate(api3, 2);
                        } else {
                            error.textContent = '❌ Timeout. Coba lagi.';
                            btn.disabled = false;
                            btn.innerHTML = '🚀 Generate QR Code';
                        }
                    }
                }, 5000);
            }
            
            function success(img) {
                const qrDiv = document.getElementById('qrcode');
                qrDiv.innerHTML = '';
                qrDiv.appendChild(img);
                
                currentImageUrl = img.src;
                
                const container = document.getElementById('qrContainer');
                container.classList.add('show');
                document.getElementById('qrContentDisplay').textContent = text;
                
                const btn = document.getElementById('generateBtn');
                btn.disabled = false;
                btn.innerHTML = '🚀 Generate QR Code';
                
                document.getElementById('error').textContent = '';
            }
        }

        function downloadQR() {
            const img = document.querySelector('#qrcode img');
            if (!img) return alert('Generate dulu!');
            
            const link = document.createElement('a');
            link.download = `qr-code-${Date.now()}.png`;
            link.href = img.src;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        async function copyQR() {
            const img = document.querySelector('#qrcode img');
            if (!img) return alert('Generate dulu!');
            
            try {
                const response = await fetch(img.src);
                const blob = await response.blob();
                
                await navigator.clipboard.write([
                    new ClipboardItem({ [blob.type]: blob })
                ]);
                alert('✅ QR Code dicopy ke clipboard!');
            } catch {
                alert('Copy gagal, coba download aja.');
            }
        }

        async function shareQR() {
            const img = document.querySelector('#qrcode img');
            if (!img) return alert('Generate dulu!');
            
            try {
                const response = await fetch(img.src);
                const blob = await response.blob();
                const file = new File([blob], 'qr-code.png', { type: 'image/png' });
                
                if (navigator.share) {
                    await navigator.share({
                        title: 'QR Code',
                        text: `QR Code untuk: ${currentText}`,
                        files: [file]
                    });
                } else {
                    downloadQR();
                }
            } catch (err) {
                if (err.name !== 'AbortError') {
                    alert('Share gagal.');
                }
            }
        }

        // Enter = generate
        document.getElementById('textInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') generateQR();
        });

        // Auto generate
        window.onload = function() {
            setTimeout(generateQR, 500);
        };
    </script>
</body>
</html>
