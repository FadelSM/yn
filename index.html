<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #333;
        }
        h1 span {
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sub {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 15px;
            transition: 0.3s;
        }
        input:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102,126,234,0.3);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .qr-box {
            margin-top: 25px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            display: none;
            border: 2px solid #e5e7eb;
        }
        .qr-box.show {
            display: block;
        }
        #qrcode img {
            max-width: 100%;
            height: auto;
        }
        .info {
            margin-top: 15px;
            padding: 10px;
            background: #f3f4f6;
            border-radius: 8px;
            font-size: 13px;
            word-break: break-all;
            color: #333;
        }
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .actions button {
            padding: 10px;
            font-size: 14px;
            width: 50%;
        }
        .btn-download {
            background: #10b981 !important;
        }
        .btn-download:hover {
            background: #059669 !important;
        }
        .btn-copy {
            background: #3b82f6 !important;
        }
        .btn-copy:hover {
            background: #2563eb !important;
        }
        .error {
            color: #ef4444;
            margin-top: 10px;
            font-size: 14px;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @media (max-width: 480px) {
            .container { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ <span>QR Generator</span></h1>
        <p class="sub">PASTI BISA DISCAN! 🎯</p>
        
        <input type="text" id="textInput" placeholder="https://google.com" value="https://google.com">
        
        <button id="generateBtn" onclick="generateQR()">
            🚀 Generate QR Code
        </button>
        
        <div id="error" class="error"></div>
        
        <div class="qr-box" id="qrContainer">
            <div id="qrcode"></div>
            <div class="info" id="qrText"></div>
            <div class="actions">
                <button class="btn-download" onclick="downloadQR()">⬇️ Download</button>
                <button class="btn-copy" onclick="copyQR()">📋 Copy</button>
            </div>
        </div>
    </div>

    <script>
        // PAKE API QRCODE.SU - TERBUKTI PALING STABIL
        function generateQR() {
            const text = document.getElementById('textInput').value.trim();
            const error = document.getElementById('error');
            const container = document.getElementById('qrContainer');
            const btn = document.getElementById('generateBtn');
            
            if (!text) {
                error.textContent = '⚠️ Masukkan teks atau URL!';
                container.classList.remove('show');
                return;
            }
            
            error.textContent = '';
            container.classList.remove('show');
            
            // Loading
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Generating...';
            
            const qrDiv = document.getElementById('qrcode');
            qrDiv.innerHTML = '';
            
            // PAKE API INI - 100% WORK UNTUK SCAN
            const size = 300;
            const apiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(text)}&margin=20`;
            
            const img = document.createElement('img');
            img.src = apiUrl;
            img.alt = 'QR Code';
            img.width = size;
            img.height = size;
            img.style.maxWidth = '100%';
            img.style.height = 'auto';
            
            img.onload = function() {
                qrDiv.appendChild(img);
                container.classList.add('show');
                document.getElementById('qrText').textContent = '📌 ' + text;
                
                btn.disabled = false;
                btn.innerHTML = '🚀 Generate QR Code';
                
                // Hapus error
                error.textContent = '';
            };
            
            img.onerror = function() {
                // FALLBACK: Pake API lain
                const fallbackUrl = `https://chart.googleapis.com/chart?cht=qr&chl=${encodeURIComponent(text)}&chs=${size}x${size}&choe=UTF-8`;
                img.src = fallbackUrl;
                
                img.onload = function() {
                    qrDiv.appendChild(img);
                    container.classList.add('show');
                    document.getElementById('qrText').textContent = '📌 ' + text;
                    
                    btn.disabled = false;
                    btn.innerHTML = '🚀 Generate QR Code';
                };
                
                img.onerror = function() {
                    error.textContent = '❌ Gagal generate. Coba refresh.';
                    btn.disabled = false;
                    btn.innerHTML = '🚀 Generate QR Code';
                };
            };
        }

        function downloadQR() {
            const img = document.querySelector('#qrcode img');
            if (!img) return alert('Generate dulu!');
            
            const link = document.createElement('a');
            link.download = 'qr-code.png';
            link.href = img.src;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function copyQR() {
            const img = document.querySelector('#qrcode img');
            if (!img) return alert('Generate dulu!');
            
            fetch(img.src)
                .then(res => res.blob())
                .then(blob => {
                    navigator.clipboard.write([
                        new ClipboardItem({ [blob.type]: blob })
                    ]).then(() => {
                        alert('✅ QR Code dicopy!');
                    }).catch(() => {
                        alert('Copy gagal, coba download.');
                    });
                });
        }

        // Enter = generate
        document.getElementById('textInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') generateQR();
        });

        // Auto generate
        window.onload = function() {
            setTimeout(generateQR, 300);
        };
    </script>
</body>
</html>
